name: CueSight
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CueSightKit:
    path: CueSightKit
targets:
  CueSight:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: CueSightKit
        product: ShotEngine
      - package: CueSightKit
        product: TableVision
      - package: CueSightKit
        product: SceneSim
      - package: CueSightKit
        product: SessionCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CueSight
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSCameraUsageDescription: "CueSight uses the camera to see the table and the balls. Images stay on your phone."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cuesight
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
